# Tool configuration only; each subsystem keeps its own requirements file and
# virtual environment (see README).

[tool.ruff]
target-version = "py311"
extend-exclude = ["**/.venv*", "build", "storage", "mobile"]

[tool.ruff.lint]
# Ruff's default rule set: real errors (undefined names, unused imports and
# variables, syntax problems), not style preferences.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# The madmom compatibility shim must run before madmom is imported.
"analysis/beats/madmom_runner.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["backend/api/app"]
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
